<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felsefe Oyunu</title>
<meta name="description" content="Kararlarınla şekillenen, felsefi ve karanlık etkileşimli hikâyeler.">
<meta name="theme-color" content="#0d0d0f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Felsefe Oyunu">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0d0d0f; --surface:#151518; --surface2:#1b1b1f; --ink:#e4e0d8; --muted:#8d887d; --faint:#5e5a52; --line:#2a2a2e;
  --accent:#b9a37a; --accent-soft:#221e16; --real:#8fa3b8; --dream:#b48fb8;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--serif);line-height:1.75;font-size:18px;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:24px 16px 96px}
button{font:inherit;color:inherit}
.ust{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:28px;font-family:var(--sans)}
.ust .marka{font-size:13px;letter-spacing:.22em;text-transform:uppercase;margin:0;font-weight:600;color:var(--accent);background:none;border:none;padding:6px 0;cursor:pointer}
.ust .sag{display:flex;gap:16px}
.ust .sag button{font-size:13px;background:none;border:none;color:var(--muted);cursor:pointer;padding:6px 0}
.ust .sag button:hover{color:var(--ink)}
.giris{margin:8px 0 34px}
.giris h1{font-size:38px;line-height:1.15;font-weight:400;margin:0 0 12px}
.giris p{color:var(--muted);margin:0;font-size:17px}
.kart{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 18px;margin:0 0 16px;cursor:pointer;transition:border-color .15s,background .15s}
.kart:hover,.kart:focus-visible{border-color:var(--accent);background:var(--surface2);outline:none}
.kart .etiket{font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0 0 8px}
.etiket.gercek{color:var(--real)} .etiket.hayali{color:var(--dream)}
.kart h2{font-size:26px;line-height:1.25;font-weight:400;margin:0}
.kart h2 .kav{font-size:16px;color:var(--muted);font-style:italic}
.kart .olcu{font-family:var(--sans);font-size:13px;color:var(--accent);margin:8px 0 12px;line-height:1.6}
.kart .ozet{font-size:16px;line-height:1.6;color:#cbc6bc;margin:0 0 14px}
.kart .durum{font-family:var(--sans);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.kart .durum b{color:var(--ink);font-weight:600}
.kunye{font-family:var(--sans);font-size:12.5px;color:var(--muted);letter-spacing:.06em;margin:0 0 6px}
.kunye b{color:var(--accent);font-weight:600}
h2.sahne{font-size:34px;line-height:1.2;font-weight:400;margin:0 0 26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.metin p{margin:0 0 1.15em}
.metin p:first-child::first-letter{font-size:2.6em;float:left;line-height:.9;padding:.08em .1em 0 0;color:var(--accent)}
.sorular{margin-top:36px}
.sorular h3{font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 14px}
.secenek{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 10px;cursor:pointer;transition:border-color .15s,background .15s}
.secenek:hover,.secenek:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
.secenek .k{font-family:var(--sans);font-weight:700;color:var(--accent);min-width:1.4em}
.secenek span:last-child{font-size:16.5px;line-height:1.6}
.yol{margin:0 0 28px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.yol summary{cursor:pointer;padding:12px 16px;font-family:var(--sans);font-size:13.5px;color:var(--muted);list-style:none}
.yol summary::-webkit-details-marker{display:none}
.yol ol{margin:0;padding:0 16px 14px 36px;font-family:var(--sans);font-size:14px;color:var(--muted);line-height:1.55}
.yol li{margin:0 0 8px}
.yol li b{color:var(--ink);font-weight:600}
.son-etiket{font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
.blok{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.blok h3{font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 14px}
.ayna p{font-style:italic;color:#d6d0c4;margin:0 0 .9em}
.sonlar{list-style:none;margin:0;padding:0;font-family:var(--sans);font-size:14.5px}
.sonlar li{padding:8px 0;border-bottom:1px solid var(--line);color:var(--faint)}
.sonlar li.bulundu{color:var(--ink)}
.sonlar li.simdi{color:var(--accent)}
.dipnot dt{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);margin:14px 0 4px}
.dipnot dd{margin:0;font-size:16px;color:#bdb7ac;line-height:1.65}
.dugmeler{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{font-family:var(--sans);font-size:14px;padding:10px 18px;border-radius:8px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#14110b;font-weight:600}
.btn.alt{background:none;color:var(--muted);border-color:var(--line);font-weight:500}
.btn.alt:hover{color:var(--ink);border-color:var(--muted)}
.filtre{margin:0 0 22px;font-family:var(--sans)}
.filtre .satir{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;align-items:center}
.filtre .baslik{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;width:100%;margin:0 0 2px}
.cip{font-family:var(--sans);font-size:13.5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.cip:hover{color:var(--ink);border-color:var(--muted)}
.cip.aktif{background:var(--accent);border-color:var(--accent);color:#14110b;font-weight:600}
.sayac{font-family:var(--sans);font-size:13px;color:var(--faint);margin:0 0 14px}
.bos{font-family:var(--sans);color:var(--muted);text-align:center;padding:30px 0}
.etiketler{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.etiketler span{font-family:var(--sans);font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.tanitim .etiket{font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0 0 8px}
.tanitim h2{font-size:36px;line-height:1.2;font-weight:400;margin:0 0 8px}
.tanitim .kav{font-family:var(--sans);font-size:14px;color:var(--muted);margin:0 0 18px;font-style:italic}
.tanitim .uzun{font-size:18px;line-height:1.75;margin:24px 0;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tanitim .olcu{font-family:var(--sans);font-size:13.5px;color:var(--accent);margin:0 0 24px}
.alt-not{font-family:var(--sans);font-size:12.5px;color:var(--faint);text-align:center;margin-top:48px}
.gir{animation:gir .45s ease}
@keyframes gir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.gir{animation:none}}
@media(max-width:480px){body{font-size:17px}h2.sahne{font-size:28px}.giris h1{font-size:31px}.kart h2{font-size:23px}}
</style>
</head>
<body>
<main id="kok"></main>
<script src="hikayeler/son-vardiya.js"></script>
<script src="hikayeler/yedek-parca.js"></script>
<script src="hikayeler/kan-bedeli.js"></script>
<script src="hikayeler/isik-sehri.js"></script>
<script src="hikayeler/babamin-defteri.js"></script>
<script src="hikayeler/teshis.js"></script>
<script src="hikayeler/bekleme-listesi.js"></script>
<script src="hikayeler/son-ders.js"></script>
<script src="hikayeler/kusursuz-bebek.js"></script>
<script src="hikayeler/otuz-alti-saat.js"></script>
<script>
(function(){
"use strict";
var H = window.HIKAYELER || [];
var kok = document.getElementById("kok");
var HARF = "ABCD";

/* ---------- depolama ---------- */
function oku(k, v){ try{ var x = localStorage.getItem(k); return x ? JSON.parse(x) : v; }catch(e){ return v; } }
function yaz(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function kayitAnahtar(h){ return "fo2:" + h.id; }
function sonAnahtar(h){ return "fo2-sonlar:" + h.id; }

/* ---------- yardımcılar ---------- */
function el(tag, a, cs){
  var e = document.createElement(tag);
  if(a) for(var k in a){
    if(k === "class") e.className = a[k];
    else if(k === "text") e.textContent = a[k];
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), a[k]);
    else e.setAttribute(k, a[k]);
  }
  (cs || []).forEach(function(c){ if(c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function kelime(s){ return (s.match(/\S+/g) || []).length; }
function sayiYaz(n){ return n.toLocaleString("tr-TR"); }
function metinDeger(x, d){ return typeof x === "function" ? x(d) : x; }

/* ---------- hikâye motoru ---------- */
function yeniDurum(h){
  var d = {}; for(var k in h.durum) d[k] = h.durum[k];
  d.son = null; d.gecti = {};
  return d;
}
function etkiUygula(d, e){
  if(!e) return;
  if(typeof e === "function"){ e(d); return; }
  for(var k in e){
    if(typeof e[k] === "number") d[k] = (d[k] || 0) + e[k];
    else d[k] = e[k];
  }
}
function yonlendir(h, id, d){
  var g = 0;
  while(h.sahneler[id] && h.sahneler[id].yonlendir && g++ < 20){
    var r = h.sahneler[id].yonlendir, hedef = null;
    for(var i = 0; i < r.length; i++){ if(!r[i].if || r[i].if(d)){ hedef = r[i].to; break; } }
    id = hedef;
  }
  return id;
}
function gorunurSecenekler(s, d){
  var out = [];
  (s.secenekler || []).forEach(function(c, i){ if(!c.if || c.if(d)) out.push({ c: c, i: i }); });
  return out;
}
/* geçmişi baştan oynatarak mevcut durumu kur; hikâye değiştiyse geçersiz kısmı at */
function oynat(h, gecmis){
  var d = yeniDurum(h), id = yonlendir(h, h.baslangic, d), gecerli = [];
  for(var j = 0; j < gecmis.length; j++){
    var a = gecmis[j], s = h.sahneler[id];
    if(!s || a.s !== id || !s.secenekler || !s.secenekler[a.c]) break;
    var c = s.secenekler[a.c];
    if(c.if && !c.if(d)) break;
    d.gecti[id] = true;
    etkiUygula(d, c.etki);
    d.son = id + HARF[a.c];
    gecerli.push(a);
    id = yonlendir(h, c.to, d);
  }
  return { d: d, id: id, gecmis: gecerli };
}

/* ---------- istatistik: bölüm aralığı, son sayısı, kelime ---------- */
function analiz(h){
  if(h._analiz) return h._analiz;
  var toplam = 0, sonlar = [], memo = {};
  function sahneKelime(s){
    var w = 0, kosullu = 0;
    (s.metin || []).forEach(function(p){
      if(typeof p === "string") w += kelime(p);
      else kosullu += kelime(p.t);
    });
    (s.secenekler || []).forEach(function(c){ if(typeof c.t === "string") w += kelime(c.t); });
    return { tam: w + kosullu, okunan: w + Math.round(kosullu * 0.35) };
  }
  for(var id in h.sahneler){
    var s = h.sahneler[id];
    if(s.yonlendir) continue;
    toplam += sahneKelime(s).tam;
    if(s.son) sonlar.push(id);
  }
  function gez(id, yigin){
    if(memo[id]) return memo[id];
    if(yigin[id]) return { minB: 0, maxB: 0, minK: 0, maxK: 0 };
    yigin[id] = true;
    var s = h.sahneler[id], hedefler = [];
    if(s.yonlendir) s.yonlendir.forEach(function(r){ hedefler.push(r.to); });
    else (s.secenekler || []).forEach(function(c){ hedefler.push(c.to); });
    var r = { minB: Infinity, maxB: 0, minK: Infinity, maxK: 0 };
    if(!hedefler.length) r = { minB: 0, maxB: 0, minK: 0, maxK: 0 };
    hedefler.forEach(function(t){
      var x = gez(t, yigin);
      r.minB = Math.min(r.minB, x.minB); r.maxB = Math.max(r.maxB, x.maxB);
      r.minK = Math.min(r.minK, x.minK); r.maxK = Math.max(r.maxK, x.maxK);
    });
    if(!s.yonlendir){
      var w = sahneKelime(s).okunan;
      r = { minB: r.minB + 1, maxB: r.maxB + 1, minK: r.minK + w, maxK: r.maxK + w };
    }
    delete yigin[id];
    memo[id] = r;
    return r;
  }
  var y = gez(h.baslangic, {});
  var okuma = Math.round((y.minK + y.maxK) / 2 / 50) * 50;
  h._analiz = { minB: y.minB, maxB: y.maxB, sonlar: sonlar, toplam: Math.round(toplam / 100) * 100, okuma: okuma, dk: Math.max(1, Math.round(okuma / 200)) };
  return h._analiz;
}

/* ---------- görünümler ---------- */
function ust(geriVar){
  var sag = el("div", { class: "sag" });
  if(geriVar) sag.appendChild(el("button", { type: "button", text: "← Hikâyeler", onclick: function(){ location.hash = ""; } }));
  return el("div", { class: "ust" }, [
    el("button", { class: "marka", type: "button", text: "Felsefe Oyunu", onclick: function(){ location.hash = ""; } }),
    sag
  ]);
}

function anaSayfa(){
  kok.textContent = "";
  kok.appendChild(ust(false));
  kok.appendChild(el("div", { class: "giris gir" }, [
    el("h1", { text: "Her karar bir bedeldir." }),
    el("p", { text: "Kararlarınla şekillenen hikâyeler. Doğru seçenek yok; yalnızca taşıyabileceğin ve taşıyamayacağın seçenekler var." })
  ]));
  var TEMALAR = ["Tümü"]; H.forEach(function(h){ (h.kategoriler || []).forEach(function(k){ if(TEMALAR.indexOf(k) < 0) TEMALAR.push(k); }); });
  var DUNYALAR = ["Tümü", "Gerçek", "Hayali"];
  var sec = oku("fo2-filtre", { tema: "Tümü", dunya: "Tümü" });
  if(TEMALAR.indexOf(sec.tema) < 0) sec.tema = "Tümü";
  if(DUNYALAR.indexOf(sec.dunya) < 0) sec.dunya = "Tümü";
  function cipSatiri(baslik, liste, anahtar){
    var satir = el("div", { class: "satir" }, [ el("p", { class: "baslik", text: baslik }) ]);
    liste.forEach(function(x){
      satir.appendChild(el("button", { type: "button", class: "cip" + (sec[anahtar] === x ? " aktif" : ""), "aria-pressed": sec[anahtar] === x ? "true" : "false", text: x, onclick: function(){
        sec[anahtar] = x; yaz("fo2-filtre", sec); anaSayfa();
      } }));
    });
    return satir;
  }
  kok.appendChild(el("div", { class: "filtre" }, [ cipSatiri("Tema", TEMALAR, "tema"), cipSatiri("Dünya", DUNYALAR, "dunya") ]));
  var gorunen = H.filter(function(h){
    var hayali = /hayali/i.test(h.dunya);
    var temaOk = sec.tema === "Tümü" || (h.kategoriler || []).indexOf(sec.tema) >= 0;
    var dunyaOk = sec.dunya === "Tümü" || (sec.dunya === "Hayali" ? hayali : !hayali);
    return temaOk && dunyaOk;
  });
  kok.appendChild(el("p", { class: "sayac", text: gorunen.length + " hikâye" }));
  if(!gorunen.length) kok.appendChild(el("p", { class: "bos", text: "Bu filtrelere uyan bir hikâye yok." }));
  gorunen.forEach(function(h){
    var a = analiz(h);
    var kayit = oku(kayitAnahtar(h), null);
    var bulunan = oku(sonAnahtar(h), []);
    var durumMetni, eylem;
    if(kayit && kayit.gecmis && kayit.gecmis.length){
      var o = oynat(h, kayit.gecmis);
      if(h.sahneler[o.id] && h.sahneler[o.id].son){ durumMetni = "Bitirdin"; eylem = "Yeniden oku"; }
      else { durumMetni = "Bölüm " + (o.gecmis.length + 1) + "'desin"; eylem = "Devam et →"; }
    } else { durumMetni = bulunan.length ? "Bitirdin" : "Başlanmadı"; eylem = bulunan.length ? "Yeniden oku" : "Başla →"; }
    if(bulunan.length) durumMetni += " · " + bulunan.length + " son buldun";
    var hayali = /hayali/i.test(h.dunya);
    kok.appendChild(el("button", { class: "kart gir", type: "button", onclick: function(){ location.hash = "#/" + h.id; } }, [
      el("p", { class: "etiket " + (hayali ? "hayali" : "gercek"), text: h.dunya }),
      el("h2", {}, [ h.baslik + " ", el("span", { class: "kav", text: "(" + h.kavramlar.join(", ") + ")" }) ]),
      el("div", { class: "etiketler" }, (h.kategoriler || []).map(function(k){ return el("span", { text: k }); })),
      el("p", { class: "olcu" }, [
        (a.minB === a.maxB ? a.minB : a.minB + "–" + a.maxB) + " bölüm", el("br"),
        "Toplam " + sayiYaz(a.toplam) + " kelime · bir okuma ≈ " + sayiYaz(a.okuma) + " kelime (~" + a.dk + " dk)"
      ]),
      el("p", { class: "ozet", text: h.ozet }),
      el("div", { class: "durum" }, [
        el("span", { text: durumMetni }),
        el("span", { text: eylem })
      ])
    ]));
  });
  kok.appendChild(el("p", { class: "alt-not", text: "İlerlemen yalnızca bu cihazda saklanır." }));
}

function hikayeSayfa(h){
  var kayit = oku(kayitAnahtar(h), { gecmis: [] });
  var o = oynat(h, kayit.gecmis || []);
  if(o.gecmis.length !== (kayit.gecmis || []).length) yaz(kayitAnahtar(h), { gecmis: o.gecmis });
  var d = o.d, id = o.id, s = h.sahneler[id];
  kok.textContent = "";
  kok.appendChild(ust(true));
  if(!o.gecmis.length && !h._basladi){
    var an = analiz(h), hay = /hayali/i.test(h.dunya);
    kok.appendChild(el("div", { class: "tanitim gir" }, [
      el("p", { class: "etiket " + (hay ? "hayali" : "gercek"), text: h.dunya }),
      el("h2", { text: h.baslik }),
      el("p", { class: "kav", text: h.kavramlar.join(" · ") }),
      el("div", { class: "etiketler" }, (h.kategoriler || []).map(function(k){ return el("span", { text: k }); })),
      el("p", { class: "uzun", text: h.giris || h.ozet }),
      el("p", { class: "olcu", text: (an.minB === an.maxB ? an.minB : an.minB + "–" + an.maxB) + " bölüm · bir okuma ≈ " + sayiYaz(an.okuma) + " kelime (~" + an.dk + " dk)" }),
      el("div", { class: "dugmeler" }, [
        el("button", { class: "btn", type: "button", text: "Okumaya başla →", onclick: function(){ h._basladi = true; render(); window.scrollTo(0,0); } }),
        el("button", { class: "btn alt", type: "button", text: "Hikâyelere dön", onclick: function(){ location.hash = ""; } })
      ])
    ]));
    return;
  }
  var kap = el("div", { class: "gir" });
  kok.appendChild(kap);

  /* yolun: verilen kararlar */
  if(o.gecmis.length){
    var liste = el("ol");
    var dd = yeniDurum(h), cur = yonlendir(h, h.baslangic, dd);
    o.gecmis.forEach(function(a){
      var ss = h.sahneler[cur], c = ss.secenekler[a.c];
      liste.appendChild(el("li", {}, [ el("b", { text: ss.baslik }), el("br"), metinDeger(c.t, dd) ]));
      dd.gecti[cur] = true; etkiUygula(dd, c.etki); dd.son = cur + HARF[a.c];
      cur = yonlendir(h, c.to, dd);
    });
    kap.appendChild(el("details", { class: "yol" }, [ el("summary", { text: "Yolun · " + o.gecmis.length + " karar" }), liste ]));
  }

  if(!s){
    kap.appendChild(el("p", { text: "Bu hikâyede bir sorun oluştu." }));
    kap.appendChild(el("button", { class: "btn", type: "button", text: "Baştan başla", onclick: function(){ yaz(kayitAnahtar(h), { gecmis: [] }); render(); } }));
    return;
  }

  var bolumNo = o.gecmis.length + 1;
  if(s.son){
    kap.appendChild(el("p", { class: "son-etiket", text: "Son · Bölüm " + bolumNo }));
  } else {
    kap.appendChild(el("p", { class: "kunye" }, [ el("b", { text: "BÖLÜM " + bolumNo }), s.saat ? "  ·  " + s.saat : "" ]));
  }
  kap.appendChild(el("h2", { class: "sahne", text: s.baslik }));
  var m = el("div", { class: "metin" });
  (s.metin || []).forEach(function(p){
    var t = typeof p === "string" ? p : ((!p.if || p.if(d)) ? p.t : null);
    if(t) m.appendChild(el("p", { text: t }));
  });
  kap.appendChild(m);

  if(s.son){
    var bulunan = oku(sonAnahtar(h), []);
    if(bulunan.indexOf(id) < 0){ bulunan.push(id); yaz(sonAnahtar(h), bulunan); }
    var ayna = h.ayna ? h.ayna(d) : [];
    if(ayna.length){
      kap.appendChild(el("div", { class: "blok ayna" }, [ el("h3", { text: "Ayna" }) ].concat(ayna.map(function(t){ return el("p", { text: t }); }))));
    }
    var ul = el("ul", { class: "sonlar" });
    bulunan.forEach(function(sid){
      if(!h.sahneler[sid]) return;
      ul.appendChild(el("li", { class: "bulundu" + (sid === id ? " simdi" : ""), text: h.sahneler[sid].baslik + (sid === id ? "  ← bu okuma" : "") }));
    });
    kap.appendChild(el("div", { class: "blok" }, [ el("h3", { text: "Bulduğun sonlar" }), ul, el("p", { class: "sayac", style: "margin-top:12px", text: "Farklı kararlarla başka sonlara ulaşabilirsin." }) ]));
    if(h.dipnot){
      var dl = el("dl", { class: "dipnot" });
      h.dipnot.forEach(function(x){ dl.appendChild(el("dt", { text: x.ad })); dl.appendChild(el("dd", { text: x.t })); });
      kap.appendChild(el("div", { class: "blok" }, [ el("h3", { text: "Bu hikâyede dokunduğumuz fikirler" }), dl ]));
    }
    kap.appendChild(el("div", { class: "dugmeler" }, [
      el("button", { class: "btn", type: "button", text: "Baştan oku", onclick: function(){ yaz(kayitAnahtar(h), { gecmis: [] }); render(); window.scrollTo(0,0); } }),
      el("button", { class: "btn alt", type: "button", text: "Hikâyelere dön", onclick: function(){ location.hash = ""; } })
    ]));
    return;
  }

  var kutu = el("div", { class: "sorular" }, [ el("h3", { text: "Ne yapıyorsun?" }) ]);
  gorunurSecenekler(s, d).forEach(function(x, n){
    kutu.appendChild(el("button", { class: "secenek", type: "button", onclick: function(){
      var g = o.gecmis.slice(); g.push({ s: id, c: x.i });
      yaz(kayitAnahtar(h), { gecmis: g });
      render(); window.scrollTo(0, 0);
    } }, [ el("span", { class: "k", text: HARF[n] + ")" }), el("span", { text: metinDeger(x.c.t, d) }) ]));
  });
  kap.appendChild(kutu);
  kap.appendChild(el("div", { class: "dugmeler" }, [
    el("button", { class: "btn alt", type: "button", text: "Baştan başla", onclick: function(){
      if(confirm("Bu hikâyedeki bütün kararların silinecek. Emin misin?")){ yaz(kayitAnahtar(h), { gecmis: [] }); render(); window.scrollTo(0,0); }
    } })
  ]));
}

function render(){
  var m = location.hash.match(/^#\/([\w-]+)/);
  var h = m && H.filter(function(x){ return x.id === m[1]; })[0];
  if(h) hikayeSayfa(h); else anaSayfa();
}
window.addEventListener("hashchange", function(){ render(); window.scrollTo(0, 0); });
window.FO = { analiz: analiz, oynat: oynat, yonlendir: yonlendir, gorunurSecenekler: gorunurSecenekler, etkiUygula: etkiUygula, yeniDurum: yeniDurum };
render();
})();
